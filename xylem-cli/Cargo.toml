[package]
name = "xylem-cli"
version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "xylem"
path = "src/main.rs"

[dependencies]
xylem-lib = { version = "1.0.3", path = "../xylem-lib" }
clap = { version = "4.4.2", features = ["derive", "unstable-doc"] }
console = { version = "0.15.7", default-features = false, features = ["ansi-parsing"] }
indicatif = "0.17.6"
nanoid = "0.4.0"
acorn-host = { workspace = true }
acorn-schema = { workspace = true }
clap-verbosity-flag = { workspace = true }
color-eyre = { workspace = true }
dotenvy = { workspace = true }
exitcode = { workspace = true }
owo-colors = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
uriparse = { workspace = true }

[target.'cfg(target_env = "musl")'.dependencies]
openssl-sys = { version = "0.9.117", features = ["vendored"] }

[dev-dependencies]
assert_cmd = "2.0.16"

[lints]
workspace = true
