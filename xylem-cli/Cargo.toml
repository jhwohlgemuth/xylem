[package]
name = "xylem-cli"
version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "xylem"
path = "src/main.rs"

[lib]
doctest = false

[dependencies]
acorn-host = { workspace = true }
acorn-schema = { workspace = true }
clap = { workspace = true, features = ["color", "derive", "error-context", "help", "std", "suggestions", "unstable-doc", "usage"] }
clap-verbosity-flag = { workspace = true }
color-eyre = { workspace = true }
dotenvy = { workspace = true }
exitcode = { workspace = true }
indicatif = { version = "0.18.6", features = ["unicode-width"], default-features = false }
nanoid = { version = "0.5.0", default-features = false }
owo-colors = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
xylem-lib = { version = "1.0.3", path = "../xylem-lib" }

[dev-dependencies]
assert_cmd = "2.1.1"

[lints]
workspace = true
