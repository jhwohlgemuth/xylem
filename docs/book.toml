[book]
authors = ["Jason Wohlgemuth"]
language = "en"
src = "src"
title = "Xylem documentation"
text-direction = "ltr"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "rust"
git-repository-url = "https://code.ornl.gov/research-enablement/xylem"
mathjax-support = true

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true
line-numbers = false
runnable = false
