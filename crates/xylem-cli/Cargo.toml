[package]
name = "xylem-cli"
version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../README.md"
edition = "2021"
rust-version.workspace = true

[features]
default = ["tui"]
tui = ["dep:xylem-tui"]

[[bin]]
name = "xylem"
path = "src/main.rs"

[lib]
doctest = false

[dependencies]
acorn-cmd = { workspace = true }
acorn-host = { workspace = true }
acorn-schema = { workspace = true }
clap = { workspace = true, features = ["color", "derive", "error-context", "help", "std", "suggestions", "unstable-doc", "usage"] }
clap-verbosity-flag = { workspace = true }
color-eyre = { workspace = true }
dotenvy = { workspace = true }
exitcode = { workspace = true }
indicatif = { version = "0.18.6", features = ["unicode-width"], default-features = false }
nanoid = { version = "0.5.0", default-features = false }
owo-colors = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
xylem-lib = { version = "1.0.3", path = "../xylem-lib" }
xylem-tui = { version = "1.0.3", path = "../xylem-tui", optional = true }

[dev-dependencies]
assert_cmd = "2.1.1"

[package.metadata.deb]
assets = [
  ["target/release/xylem", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/xylem/README.md", "644"],
  ["../../docs/src/_assets/xylem-app-icon.svg", "usr/share/icons/hicolor/scalable/apps/gov.ornl.xylem.svg", "644"],
  ["../../packaging/linux/gov.ornl.xylem.desktop", "usr/share/applications/gov.ornl.xylem.desktop", "644"],
  ["../../packaging/linux/gov.ornl.xylem.metainfo.xml", "usr/share/metainfo/gov.ornl.xylem.metainfo.xml", "644"],
]
depends = "ca-certificates"
extended-description = "Xylem runs structured research data workflows and provides a terminal dashboard for monitoring retained run history."
license-file = ["../../LICENSE", "0"]
maintainer = "Jason Wohlgemuth <wohlgemuthjh@ornl.gov>"
name = "xylem"
priority = "optional"
section = "science"

[lints]
workspace = true
