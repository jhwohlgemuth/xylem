[package]
name = "xylem-lib"
version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../README.md"
edition = "2021"
rust-version.workspace = true

[dependencies]
bon = { version = "3.8.1", default-features = false }
bytes = { version = "1.10.1", default-features = false }
clap = { version = "4.5.51", features = ["std", "derive"], default-features = false }
derive_more = { version = "2.0.1", features = ["display", "from_str"], default-features = false }
fancy-regex = { version = "0.17.0", default-features = false }
pyproject-toml = { version = "0.13.7", default-features = false }
toml = { version = "0.9.8", default-features = false }
valuable = { version = "0.1.1", features = ["alloc"], default-features = false }
valuable-derive = { version = "0.1.1", default-features = false }
which = { version = "8.0.0", features = ["real-sys"], default-features = false }
acorn-cmd = { workspace = true }
acorn-core = { workspace = true }
acorn-host = { workspace = true }
acorn-lib = { workspace = true }
acorn-schema = { workspace = true }
convert_case = { workspace = true }
dotenvy = { workspace = true }
exitcode = { workspace = true }
glob = { workspace = true }
owo-colors = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
serde_with = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uriparse = { workspace = true }
url = { workspace = true }

[dev-dependencies]
assert_cmd = "2.1.1"

[lints.rust]
# missing-docs = "deny"
rust-2018-idioms = "warn"
unsafe_code = "forbid"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
