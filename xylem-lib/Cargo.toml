[package]
name = "xylem-lib"
version.workspace = true
authors.workspace = true
description.workspace = true
edition = "2021"

[dependencies]
bon = { version = "3.8.1", default-features = false }
bytes = { version = "1.10.1", default-features = false }
clap = { version = "4.5.51", default-features = false }
derive_more = { version = "2.0.1", features = ["display", "from_str"], default-features = false }
env_logger = { version = "0.11.8", default-features = false }
fancy-regex = { version = "0.16.2", default-features = false }
is_executable = { version = "1.0.5", default-features = false }
is-terminal = { version = "0.4.17", default-features = false }
openssl = { version = "0.10.74", default-features = false }
pyproject-toml = { version = "0.13.7", default-features = false }
reqwest = { version = "0.12.24", default-features = false }
serde_yml = { version = "0.0.12", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
tokio = { version = "1.48.0", features = ["rt", "time", "rt-multi-thread"], default-features = false }
toml = { version = "0.9.8", default-features = false }
valuable = { version = "0.1.1", features = ["alloc"], default-features = false }
valuable-derive = { version = "0.1.1", default-features = false }
which = { version = "8.0.0", default-features = false }
acorn-lib = { workspace = true }
clap-verbosity-flag = { workspace = true }
color-eyre = { workspace = true }
dotenvy = { workspace = true }
exitcode = { workspace = true }
owo-colors = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
uriparse = { workspace = true }

[dev-dependencies]
assert_cmd = "2.1.1"

[lints.rust]
# missing-docs = "deny"
rust-2018-idioms = "warn"
unsafe_code = "forbid"

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
