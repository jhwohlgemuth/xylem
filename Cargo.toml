[workspace]
members = ["crates/xylem-cli", "crates/xylem-lib", "crates/xylem-tui", "tools/memory-spike", "xtask"]
resolver = "2"

[workspace.package]
version = "1.0.4"
rust-version = "1.98.0"
license = "MIT"
authors = ["Jason Wohlgemuth <wohlgemuthjh@ornl.gov>"]
description = "Digital xylem that transports data through workflows with structure and support"
documentation = "https://xylem.ornl.gov"
readme = "README.md"
homepage = "https://xylem.ornl.gov"
repository = "https://code.ornl.gov/research-enablement/xylem"
keywords = ["research", "automation"]
exclude = [".vale", ".vscode"]

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
arithmetic_side_effects = "warn"
# cast_possible_truncation = "deny"
# cast_precision_loss = "deny"
# cast_possible_wrap = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
# expect_used = "warn"
indexing_slicing = "warn"
join_absolute_paths = "warn"
match_same_arms = "warn"
option_env_unwrap = "warn"
panic = "warn"
panicking_unwrap = "warn"
serde_api_misuse = "warn"
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
transmute_ptr_to_ref = "deny"
transmute_undefined_repr = "deny"
uninit_vec = "warn"
unchecked_time_subtraction = "deny"
unwrap_used = "warn"
# wildcard_enum_match_arm = "warn"
# wildcard_imports = "warn"
# wildcard_in_or_patterns = "warn"

[workspace.dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
acorn-cmd = { git = "https://code.ornl.gov/research-enablement/acorn.git", rev = "3e915697d214eda33e0d4c52f03fb09f27d9d3e4", version = "0.5.1", default-features = false }
acorn-core = { git = "https://code.ornl.gov/research-enablement/acorn.git", rev = "3e915697d214eda33e0d4c52f03fb09f27d9d3e4", version = "0.5.1", features = ["alloc", "std"], default-features = false }
acorn-host = { git = "https://code.ornl.gov/research-enablement/acorn.git", rev = "3e915697d214eda33e0d4c52f03fb09f27d9d3e4", version = "0.5.1", features = ["config", "fs", "terminal"], default-features = false }
acorn-macros = { git = "https://code.ornl.gov/research-enablement/acorn.git", rev = "3e915697d214eda33e0d4c52f03fb09f27d9d3e4", version = "0.5.1", default-features = false }
acorn-schema = { git = "https://code.ornl.gov/research-enablement/acorn.git", rev = "3e915697d214eda33e0d4c52f03fb09f27d9d3e4", version = "0.5.1", features = ["alloc"], default-features = false }
cel = { version = "=0.14.5", default-features = false }
clap = { version = "4.5.51", default-features = false }
clap-verbosity-flag = { version = "3.0.4", features = ["log"], default-features = false }
color-eyre = { version = "0.6.5", default-features = false }
convert_case = { version = "0.11.0", default-features = false }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
csv = { version = "1.4.0", default-features = false }
dotenvy = { version = "0.15.7", default-features = false }
exitcode = { version = "1.1.2", default-features = false }
glob = { version = "0.3.1", default-features = false }
jsonc-parser = { version = "0.33", features = ["serde", "serde_json"], default-features = false }
owo-colors = { version = "4.2.3", default-features = false }
rayon = { version = "1.12.0", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.2", features = ["blocking", "rustls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"], default-features = false }
serde_json = { version = "1.0.149", default-features = false }
serde_norway = { version = "0.9.42", default-features = false }
serde_with = { version = "=3.16.1", features = ["macros"], default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
strum = { version = "0.28.0", features = ["derive"], default-features = false }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }
tar = { version = "0.4.44", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
tracing = { version = "0.1.44", features = ["attributes"], default-features = false }
tracing-log = { version = "0.2.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = [
  "ansi",
  "env-filter",
], default-features = false }
uriparse = { version = "0.6.4", default-features = false }
url = { version = "2.5.7", default-features = false }

[workspace.metadata.cross.build]
default-target = "x86_64-unknown-linux-musl"
debug-assertions = true

[profile.release]
debug = true
codegen-units = 1
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = true
lto = true

[profile.coverage]
inherits = "test"
debug = 1
