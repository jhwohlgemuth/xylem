[package]
name = "pipe"
readme = "README.md"
homepage = "https://pipe.ornl.gov"
repository = "https://code.ornl.gov/GSHS/common/pipe/command"
version = "0.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.4.2", features = ["derive"] }
clap-verbosity-flag = "2.2.0"
console = { version = "0.15.7", default-features = false, features = ["ansi-parsing"] }
dotenv = "0.15.0"
env_logger = "0.11.3"
fancy-regex = "0.13.0"
glob = "0.3.1"
indicatif = "0.17.6"
is-terminal = "0.4.9"
log = "0.4.20"
nanoid = "0.4.0"
rayon = "1.7.0"
regex = "1.9.5"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
uriparse = "0.6.4"

[dev-dependencies]
cargo-watch = "8.4.1"

[lib]
name = "pipe"
path = "src/lib.rs"
test = false
doctest = false

[lints.rust]
unsafe_code = "forbid"
