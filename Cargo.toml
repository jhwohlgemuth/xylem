[workspace]
members = ["xylem-cli", "xylem-lib"]
resolver = "2"

[workspace.package]
version = "1.0.0"
rust-version = "1.96.0"
license = "MIT"
authors = ["Jason Wohlgemuth <wohlgemuthjh@ornl.gov>"]
description = "Parallel Integration and Processing Engine"
documentation = "https://xylem.ornl.gov"
readme = "README.md"
homepage = "https://xylem.ornl.gov"
repository = "https://code.ornl.gov/research-enablement/xylem"
keywords = ["research", "automation"]
exclude = [".vale", ".vscode"]

[workspace.lints.rust]
missing-docs = "deny"
rust-2018-idioms = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken-intra-doc-links = "forbid"

[workspace.dependencies]
# ACORN 0.2 is not published on crates.io yet. Pin the audited upstream
# revision so builds remain reproducible without relying on a sibling checkout.
acorn-core = { version = "0.2.0", git = "https://code.ornl.gov/research-enablement/acorn.git", rev = "5fce06f959fb7ed0fe59dbaf7cedf2d93209e963", features = ["alloc"], default-features = false }
acorn-lib = { version = "0.2.0", git = "https://code.ornl.gov/research-enablement/acorn.git", rev = "5fce06f959fb7ed0fe59dbaf7cedf2d93209e963", features = ["analysis"], default-features = false }
clap-verbosity-flag = { version = "3.0.4", features = ["log"], default-features = false }
color-eyre = { version = "0.6.5", default-features = false }
convert_case = { version = "0.11.0", default-features = false }
dotenvy = { version = "0.15.7", default-features = false }
exitcode = { version = "1.1.2", default-features = false }
owo-colors = { version = "4.2.3", default-features = false }
rayon = { version = "1.12.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"], default-features = false }
serde_json = { version = "1.0.149", default-features = false }
tracing = { version = "0.1.44", features = ["attributes"], default-features = false }
tracing-log = { version = "0.2.0", default-features = false }
# Pinned to ensure colored ANSI output
tracing-subscriber = { version = "=0.3.22", features = [
  "ansi",
  "env-filter",
], default-features = false }
uriparse = { version = "0.6.4", default-features = false }

[workspace.metadata.cross.build]
default-target = "x86_64-unknown-linux-musl"
debug-assertions = true

[profile.release]
debug = true
codegen-units = 1
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = true
lto = true
