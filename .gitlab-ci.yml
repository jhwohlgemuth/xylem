    - .validate-linux
    - .rust-arm64
  variables:
    DEB_ARCH: arm64
    APPIMAGE_ARCH: aarch64
    EXPECT_FILE_TYPE: "ARM aarch64|ARM64"
    EXPECT_EXEC: xylem tui
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Makefile
        - crates/xylem-cli/Cargo.toml
        - docs/src/_assets/xylem-app-icon.svg
        - packaging/linux/**/*
        - scripts/install-appimage-tools.sh
        - scripts/install-zigbuild.sh
        - scripts/package-linux.sh

# ---------------------------------------------------------------- release ----

publish-crates:
  extends: .publish
  stage: release
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - amd64
  resource_group: crates-io
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
  script:
    - cargo xtask publish-crates

publish-homebrew-formula:
  extends: .publish
  stage: release
  image: alpine@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
  tags:
    - amd64
  resource_group: homebrew-tap
  needs:
    - job: prepare-environment
      artifacts: true
    - job: test
    - job: test-homebrew-formula
    - job: publish-crates
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
  before_script:
    - apk add --no-cache cargo curl git
  script:
    - |
      set -eu
      test -n "${HOMEBREW_TAP_REPO_URL:-}" || { echo "HOMEBREW_TAP_REPO_URL is required" >&2; exit 1; }
      test -n "${HOMEBREW_TAP_ACCESS_TOKEN:-}" || { echo "HOMEBREW_TAP_ACCESS_TOKEN is required" >&2; exit 1; }
      version="${CI_COMMIT_TAG#v}"
      test "${version}" = "${PKG_VERSION}"
      cargo xtask homebrew-formula "${version}" Formula/xylem.rb
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --range 0-0 --output /dev/null --retry 5 --retry-all-errors -LsSf "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${version}/${BINARY_NAME}"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --range 0-0 --output /dev/null --retry 5 --retry-all-errors -LsSf "${PKG_REGISTRY_URL}/${DEFAULT_WINDOWS_TARGET}/v${version}/${BINARY_NAME}.exe"

      tap_branch="${HOMEBREW_TAP_BRANCH:-main}"
      tap_formula_path="${HOMEBREW_TAP_FORMULA_PATH:-Formula/xylem.rb}"
      release_branch="release/xylem-v${version}"
      authenticated_url="https://oauth2:${HOMEBREW_TAP_ACCESS_TOKEN}@${HOMEBREW_TAP_REPO_URL#https://}"
      git clone "${authenticated_url}" tap
      git -C tap remote set-url origin "${HOMEBREW_TAP_REPO_URL}"
      git -C tap config user.name "${GIT_USER_NAME}"
      git -C tap config user.email "${GIT_USER_EMAIL:-xylem-ci@noreply.invalid}"

      if git -C tap show-ref --verify --quiet "refs/remotes/origin/${tap_branch}"; then
        git -C tap checkout -B "${tap_branch}" "origin/${tap_branch}"
      else
        git -C tap checkout --orphan "${tap_branch}"
        cp scripts/homebrew/tap.README.md tap/README.md
        git -C tap add README.md
        git -C tap commit -m "chore: initialize Xylem tap"
        git -C tap push "${authenticated_url}" "HEAD:${tap_branch}"
      fi

      if git -C tap show-ref --verify --quiet "refs/remotes/origin/${release_branch}"; then
        git -C tap checkout -B "${release_branch}" "origin/${release_branch}"
      else
        git -C tap checkout -B "${release_branch}"
      fi
      mkdir -p "tap/$(dirname "${tap_formula_path}")"
      cp Formula/xylem.rb "tap/${tap_formula_path}"
      cp scripts/homebrew/tap.gitlab-ci.yml tap/.gitlab-ci.yml
      git -C tap add "${tap_formula_path}" .gitlab-ci.yml
      if git -C tap diff --cached --quiet; then
        echo "No Homebrew tap changes detected"
        exit 0
      fi
      git -C tap commit -m "chore(homebrew): update xylem v${version}"
      git -C tap push \
        -o merge_request.create \
        -o "merge_request.target=${tap_branch}" \
        -o merge_request.remove_source_branch \
        -o "merge_request.title=chore(homebrew): update xylem v${version}" \
        "${authenticated_url}" "HEAD:${release_branch}"

publish-release-linux:
  extends: .publish
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.25.0
  tags:
    - amd64
  needs:
    - job: prepare-environment
      artifacts: true
    - job: upload-binaries
  script:
    - echo "Publishing ${BINARY_NAME} v${PKG_VERSION}"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  release:
    tag_name: "v${PKG_VERSION}"
    description: "## ${BINARY_NAME} v${PKG_VERSION}\n> See [CHANGELOG](${CHANGELOG}) for details"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "${BINARY_NAME} v${PKG_VERSION} (Linux)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}"
        - name: "${BINARY_NAME} v${PKG_VERSION} (Linux SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}.sha256"
        - name: "${BINARY_NAME} v${PKG_VERSION} (Windows)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_WINDOWS_TARGET}/v${PKG_VERSION}/${BINARY_NAME}.exe"
        - name: "${BINARY_NAME} v${PKG_VERSION} (Windows SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_WINDOWS_TARGET}/v${PKG_VERSION}/${BINARY_NAME}.exe.sha256"
        - name: "${BINARY_NAME} AppImage v${PKG_VERSION} (ARM64)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_ARM64_TARGET}/v${PKG_VERSION}/${BINARY_NAME}-v${PKG_VERSION}-aarch64.AppImage"
        - name: "${BINARY_NAME} AppImage v${PKG_VERSION} (ARM64 SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_ARM64_TARGET}/v${PKG_VERSION}/${BINARY_NAME}-v${PKG_VERSION}-aarch64.AppImage.sha256"
        - name: "${BINARY_NAME} AppImage v${PKG_VERSION} (x86_64)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}-v${PKG_VERSION}-x86_64.AppImage"
        - name: "${BINARY_NAME} AppImage v${PKG_VERSION} (x86_64 SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}-v${PKG_VERSION}-x86_64.AppImage.sha256"
        - name: "${BINARY_NAME} Debian v${PKG_VERSION} (amd64)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}_${PKG_VERSION}-1_amd64.deb"
        - name: "${BINARY_NAME} Debian v${PKG_VERSION} (amd64 SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}_${PKG_VERSION}-1_amd64.deb.sha256"
        - name: "${BINARY_NAME} Debian v${PKG_VERSION} (ARM64)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_ARM64_TARGET}/v${PKG_VERSION}/${BINARY_NAME}_${PKG_VERSION}-1_arm64.deb"
        - name: "${BINARY_NAME} Debian v${PKG_VERSION} (ARM64 SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_ARM64_TARGET}/v${PKG_VERSION}/${BINARY_NAME}_${PKG_VERSION}-1_arm64.deb.sha256"

publish-sandbox-runner:
  extends: .publish
  stage: release
  image:
    name: moby/buildkit:rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    entrypoint: [""]
  tags:
    - amd64
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    DOCKER_CONFIG: /tmp/xylem-docker
    SOURCE_DATE_EPOCH: "1789689600"
  resource_group: sandbox-runner
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - sandbox/runner/**/*
  before_script:
    - test -n "${GHCR_TOKEN:-}"
    - mkdir -p "${DOCKER_CONFIG}"
    - ghcr_auth="$(printf '%s:%s' "${GHCR_USER}" "${GHCR_TOKEN}" | base64 | tr -d '\n')"
    - savannah_auth="$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
    - printf '{"auths":{"ghcr.io":{"auth":"%s"},"%s":{"auth":"%s"}}}\n' "${ghcr_auth}" "${CI_REGISTRY}" "${savannah_auth}" > "${DOCKER_CONFIG}/config.json"
  script:
    - image_names="${SANDBOX_RUNNER_SAVANNAH_IMAGE}:${CI_COMMIT_SHA},${SANDBOX_RUNNER_GHCR_IMAGE}:${CI_COMMIT_SHA},${SANDBOX_RUNNER_SAVANNAH_IMAGE}:latest,${SANDBOX_RUNNER_GHCR_IMAGE}:latest"
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then version="${CI_COMMIT_TAG#v}"; image_names="${image_names},${SANDBOX_RUNNER_SAVANNAH_IMAGE}:${version},${SANDBOX_RUNNER_GHCR_IMAGE}:${version}"; fi
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=sandbox/runner
      --local dockerfile=sandbox/runner
      --opt filename=Containerfile
      --opt platform=linux/amd64
      --opt build-arg:SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}"
      --metadata-file sandbox-runner-metadata.json
      --output type=image,name="${image_names}",push=true,name-canonical=true,oci-mediatypes=true,rewrite-timestamp=true,compatibility-version=30
    - digest="$(awk -F '"' '$2 == "containerimage.digest" { print $4 }' sandbox-runner-metadata.json)"
    - test -n "${digest}"
    - printf 'XYLEM_SANDBOX_WORKLOAD=%s@%s\n' "${SANDBOX_RUNNER_SAVANNAH_IMAGE}" "${digest}" > sandbox-runner.env
    - printf 'XYLEM_SANDBOX_WORKLOAD_GHCR=%s@%s\n' "${SANDBOX_RUNNER_GHCR_IMAGE}" "${digest}" >> sandbox-runner.env
    - printf 'XYLEM_SANDBOX_WORKLOAD_SAVANNAH=%s@%s\n' "${SANDBOX_RUNNER_SAVANNAH_IMAGE}" "${digest}" >> sandbox-runner.env
  artifacts:
    reports:
      dotenv: sandbox-runner.env
    paths:
      - sandbox-runner-metadata.json

upload-binaries:
  extends: .publish
  stage: release
  image: curlimages/curl@sha256:b375ea94488a70540f48df7a7029bcce50e650915816e6497774db9451b4f877
  tags:
    - amd64
  resource_group: gitlab-package-uploads
  needs:
    - job: prepare-environment
      artifacts: true
    - job: build-release
      artifacts: true
    - job: validate-linux-amd64
    - job: validate-linux-arm64
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  script:
    - ls -la bin/
    - sh scripts/upload-binaries.sh

