include:
  - project: research-enablement/templates
    file: /gitlab/rust-release.gitlab-ci.yml
    ref: main

# Override the shared workflow's rules. The template also admits scheduled
# pipelines and the modelpack drift check, which are acorn-specific and would
# create empty pipelines here. `rules` is an array, so this replaces it
# outright; `auto_cancel` is a map, so it is still deep merged from the
# template.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

variables:
  BINARY_NAME: xylem
  DEB_PACKAGE_NAME: xylem
  DESKTOP_ID: gov.ornl.xylem
  METAINFO_FILE: packaging/linux/gov.ornl.xylem.metainfo.xml
  DESKTOP_FILE: packaging/linux/gov.ornl.xylem.desktop
  ICON_SVG: docs/src/_assets/xylem-app-icon.svg
  LINUX_PACKAGE_TARGETS: build linux-packages release-checksums
  CHANGELOG: https://code.ornl.gov/research-enablement/xylem/-/blob/main/CHANGELOG.md
  GIT_USER_EMAIL: $GITLAB_USER_EMAIL
  GIT_USER_NAME: Xylem CI
  HOMEBREW_TAP_REPO_URL: https://code.ornl.gov/research-enablement/homebrew-xylem.git
  HOMEBREW_TAP_BRANCH: main
  HOMEBREW_TAP_FORMULA_PATH: Formula/xylem.rb
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
  HADOLINT_VERSION: "2.15.1"
  CI_DEBUG_SERVICES: true
  GHCR_USER: jhwohlgemuth
  IS_VERSION_TAGGED: '$CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/'
  SANDBOX_RUNNER_GHCR_IMAGE: ghcr.io/jhwohlgemuth/xylem
  SANDBOX_RUNNER_SAVANNAH_IMAGE: savannah.ornl.gov/research-enablement/xylem/runner
  SANDBOX_GEOSPATIAL_GHCR_IMAGE: ghcr.io/jhwohlgemuth/xylem-geospatial
  SANDBOX_GEOSPATIAL_SAVANNAH_IMAGE: savannah.ornl.gov/research-enablement/xylem/geospatial
  XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"

stages:
  - prepare
  - test
  - sandbox
  - build
  - release
  - docs

# Hidden job templates. Anchors must precede any job that extends them.

.openshell-conformance:
  stage: sandbox
  allow_failure: true
  when: manual
  timeout: 20 minutes
  variables:
    XYLEM_OPENSHELL_VERSION: "0.1.2"
    XYLEM_SANDBOX_EVIDENCE_DIR: $CI_PROJECT_DIR/sandbox-conformance-evidence/openshell/$XYLEM_OPENSHELL_DRIVER
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - crates/xylem-lib/**/*
        - examples/openshell-provider/**/*
        - sandbox/runner/**/*
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - mkdir -p "${XYLEM_SANDBOX_EVIDENCE_DIR}"
    - test -n "${XYLEM_OPENSHELL_WORKLOAD:-}"
    - openshell --version | tee "${XYLEM_SANDBOX_EVIDENCE_DIR}/openshell-version.txt"
    - grep -Eq "(^|[[:space:]])v?${XYLEM_OPENSHELL_VERSION//./\\.}($|[[:space:]])" "${XYLEM_SANDBOX_EVIDENCE_DIR}/openshell-version.txt"
    - cargo test -p xylem-lib sandbox::openshell::tests::test_openshell_provider_feasibility -- --ignored --exact
  artifacts:
    when: always
    paths:
      - sandbox-conformance-evidence/openshell/

# ---------------------------------------------------------------- prepare ----

prepare-environment:
  extends: .prepare-environment
  inherit:
    variables: false
  rules:
    # Inlined: this job sets inherit: variables: false, so $IS_VERSION_TAGGED is
    # unavailable here. Keep in sync with IS_VERSION_TAGGED above.
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Makefile
        - crates/xylem-cli/Cargo.toml
        - docs/src/_assets/xylem-app-icon.svg
        - packaging/linux/**/*
        - scripts/install-appimage-tools.sh
        - scripts/install-zigbuild.sh
        - scripts/package-linux.sh
        - scripts/upload-binaries.sh
  script:
    - echo "PKG_VERSION=$(awk -F ' = ' '$1 == "version" { gsub(/["\r]/, "", $2); print $2; exit }' Cargo.toml)" >> variables.env
    - echo "PKG_REGISTRY_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic" >> variables.env
    - echo "DEFAULT_ARM64_TARGET=$(awk -F ' *= *' '$1=="DEFAULT_ARM64_TARGET"{ sub(/\r$/,"",$2); print $2; exit }' Makefile)" >> variables.env
    - echo "DEFAULT_TARGET=$(awk -F ' = ' '$1 ~ /default-target/ { gsub(/["]/, "", $2); printf("%s",$2) }' Cargo.toml | tr . _)" >> variables.env
    - echo "DEFAULT_WINDOWS_TARGET=$(awk -F ' *= *' '$1=="DEFAULT_WINDOWS_TARGET"{ sub(/\r$/,"",$2); print $2; exit }' Makefile)" >> variables.env
    - test -z "${CI_COMMIT_TAG:-}" || test "${CI_COMMIT_TAG}" = "v$(awk -F ' = ' '$1 == "version" { gsub(/["\r]/, "", $2); print $2; exit }' Cargo.toml)"
  artifacts:
    reports:
      dotenv: variables.env

# ------------------------------------------------------------------- test ----

test:
  stage: test
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - amd64
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - crates/${BINARY_NAME}-cli/**/*
        - crates/${BINARY_NAME}-lib/**/*
        - Cargo.toml
        - scripts/prepare-acquisition-ci.sh
  before_script:
    - rustup component add rustfmt clippy
    - mkdir -p /tmp/xylem-ci-bin
    - curl -LsSf --output /tmp/xylem-ci-bin/hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
    - printf '%s  %s\n' "${HADOLINT_SHA256}" /tmp/xylem-ci-bin/hadolint | sha256sum --check -
    - chmod 0755 /tmp/xylem-ci-bin/hadolint
    - export PATH="/tmp/xylem-ci-bin:/usr/sbin:${PATH}"
    - sh scripts/prepare-acquisition-ci.sh
  script:
    - make test-ci

test-acquisition-amd64:
  stage: test
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - amd64
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - crates/xylem-lib/**/*
        - scripts/prepare-acquisition-ci.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - crates/xylem-lib/**/*
        - scripts/prepare-acquisition-ci.sh
  before_script:
    - sh scripts/prepare-acquisition-ci.sh
    - export PATH="/tmp/xylem-ci-bin:/usr/sbin:${PATH}"
  script:
    - cargo test -p xylem-lib acquisition::tests --locked

test-acquisition-arm64:
  extends: .rust-arm64
  stage: test
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - crates/xylem-lib/**/*
        - scripts/prepare-acquisition-ci.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - crates/xylem-lib/**/*
        - scripts/prepare-acquisition-ci.sh
  before_script:
    - sh scripts/prepare-acquisition-ci.sh
    - export PATH="/tmp/xylem-ci-bin:/usr/sbin:${PATH}"
  script:
    - cargo test -p xylem-lib acquisition::tests --locked

test-docs:
  stage: test
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - amd64
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/**/*
        - Makefile
        - README.md
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - Makefile
        - README.md
  script:
    - command -v mdbook >/dev/null || cargo install --locked mdbook@0.5.2
    - mdbook --version
    - make book

test-homebrew-formula:
  stage: test
  image: alpine@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
  tags:
    - amd64
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .cargo/**/*
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Makefile
        - scripts/homebrew/**/*
        - xtask/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .cargo/**/*
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Makefile
        - scripts/homebrew/**/*
        - xtask/**/*
  before_script:
    - apk add --no-cache cargo make ruby
  script:
    - |
      set -eu
      version="$(awk -F ' = ' '$1 == "version" { gsub(/[\"]/, "", $2); print $2; exit }' Cargo.toml)"
      test "$(make --no-print-directory version)" = "${version}"
      sha256="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      test_directory="$(mktemp -d)"
      trap 'rm -rf "${test_directory}"' EXIT
      expect_failure() {
        if "$@" >/dev/null 2>&1; then
          echo "Expected command to fail: $*" >&2
          exit 1
        fi
      }
      cargo xtask homebrew-formula "${version}" "${test_directory}/first.rb" "${sha256}"
      cargo xtask homebrew-formula "${version}" "${test_directory}/second.rb" "${sha256}"
      cmp "${test_directory}/first.rb" "${test_directory}/second.rb"
      grep -Fq "static.crates.io/crates/xylem-cli/xylem-cli-${version}.crate" "${test_directory}/first.rb"
      grep -Fq "sha256 \"${sha256}\"" "${test_directory}/first.rb"
      ! grep -Fq 'depends_on "pkgconf" => :build' "${test_directory}/first.rb"
      ! grep -Fq 'depends_on "openssl@3"' "${test_directory}/first.rb"
      ruby -c "${test_directory}/first.rb"
      expect_failure cargo xtask homebrew-formula "v${version}" "${test_directory}/invalid.rb" "${sha256}"
      expect_failure cargo xtask homebrew-formula "9.9.9" "${test_directory}/invalid.rb" "${sha256}"
      expect_failure cargo xtask homebrew-formula "${version}" "${test_directory}/invalid.rb" missing
      printf '\n# drift\n' >> "${test_directory}/second.rb"
      expect_failure cmp "${test_directory}/first.rb" "${test_directory}/second.rb"

# ---------------------------------------------------------------- sandbox ----

build-geospatial-sandbox-workload:
  stage: sandbox
  allow_failure: true
  when: manual
  timeout: 20 minutes
  image:
    name: moby/buildkit:rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    entrypoint: [""]
  tags:
    - amd64
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    SOURCE_DATE_EPOCH: "1789689600"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - sandbox/runner/geospatial/**/*
  script:
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=sandbox/runner/geospatial
      --local dockerfile=sandbox/runner/geospatial
      --opt filename=Containerfile
      --opt platform=linux/amd64
      --opt build-arg:SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}"
      --metadata-file geospatial-sandbox-metadata.json
      --output type=oci,dest=geospatial-sandbox.tar,oci-mediatypes=true,rewrite-timestamp=true,compatibility-version=30
    - digest="$(awk -F '"' '$2 == "containerimage.digest" { print $4 }' geospatial-sandbox-metadata.json)"
    - test -n "${digest}"
  artifacts:
    expire_in: 1 week
    paths:
      - geospatial-sandbox-metadata.json
      - geospatial-sandbox.tar

build-sandbox-runner:
  stage: sandbox
  allow_failure: true
  when: manual
  timeout: 20 minutes
  image:
    name: moby/buildkit:rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    entrypoint: [""]
  tags:
    - amd64
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    SOURCE_DATE_EPOCH: "1789689600"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - sandbox/runner/**/*
  script:
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=sandbox/runner
      --local dockerfile=sandbox/runner
      --opt filename=Containerfile
      --opt platform=linux/amd64
      --opt build-arg:SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}"
      --metadata-file /tmp/sandbox-runner-first.json
      --output type=oci,dest=/tmp/sandbox-runner-first.tar,oci-mediatypes=true,rewrite-timestamp=true,compatibility-version=30
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=sandbox/runner
      --local dockerfile=sandbox/runner
      --opt filename=Containerfile
      --opt platform=linux/amd64
      --opt build-arg:SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}"
      --metadata-file sandbox-runner-metadata.json
      --output type=oci,dest=sandbox-runner.tar,oci-mediatypes=true,rewrite-timestamp=true,compatibility-version=30
    - first_digest="$(awk -F '"' '$2 == "containerimage.digest" { print $4 }' /tmp/sandbox-runner-first.json)"
    - second_digest="$(awk -F '"' '$2 == "containerimage.digest" { print $4 }' sandbox-runner-metadata.json)"
    - test -n "${first_digest}"
    - test "${first_digest}" = "${second_digest}"
  artifacts:
    expire_in: 1 week
    paths:
      - sandbox-runner-metadata.json
      - sandbox-runner.tar

dependency-security:
  stage: sandbox
  allow_failure: true
  when: manual
  timeout: 20 minutes
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - amd64
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2 cargo-shear@1.14.0
  script:
    - make audit

docker-sandbox-conformance:
  stage: sandbox
  allow_failure: true
  when: manual
  timeout: 20 minutes
  tags:
    - sandbox-docker-rootless-amd64
  variables:
    XYLEM_SANDBOX_EVIDENCE_DIR: $CI_PROJECT_DIR/sandbox-conformance-evidence/docker-sandbox
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - crates/xylem-cli/**/*
        - crates/xylem-lib/**/*
        - examples/docker-sandbox-provider/**/*
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - mkdir -p "${XYLEM_SANDBOX_EVIDENCE_DIR}"
    - sbx version --json | tee "${XYLEM_SANDBOX_EVIDENCE_DIR}/sbx-version.json"
    - sbx ls --json | tee "${XYLEM_SANDBOX_EVIDENCE_DIR}/sbx-before.json"
    - cargo test -p xylem-lib sandbox::docker_sandbox::tests::test_native_docker_sandbox_feasibility -- --ignored --exact
    - cargo test -p xylem-cli test_docker_sandbox_example_native_end_to_end -- --ignored --exact
  after_script:
    - mkdir -p "${XYLEM_SANDBOX_EVIDENCE_DIR}"
    - sbx ls --json > "${XYLEM_SANDBOX_EVIDENCE_DIR}/sbx-after.json" || true
  artifacts:
    when: always
    paths:
      - sandbox-conformance-evidence/docker-sandbox/

openshell-docker-conformance:
  extends: .openshell-conformance
  tags:
    - sandbox-docker-rootless-amd64
  variables:
    XYLEM_OPENSHELL_DRIVER: docker

openshell-podman-conformance:
  extends: .openshell-conformance
  tags:
    - sandbox-podman-rootless-amd64
  variables:
    XYLEM_OPENSHELL_DRIVER: podman

publish-geospatial-sandbox-workload:
  extends: .publish
  stage: sandbox
  allow_failure: true
  when: manual
  timeout: 20 minutes
  image:
    name: moby/buildkit:rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    entrypoint: [""]
  tags:
    - amd64
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    DOCKER_CONFIG: /tmp/xylem-geospatial-docker
    SOURCE_DATE_EPOCH: "1789689600"
  resource_group: sandbox-geospatial-workload
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - sandbox/runner/geospatial/**/*
  before_script:
    - test -n "${GHCR_TOKEN:-}"
    - mkdir -p "${DOCKER_CONFIG}"
    - ghcr_auth="$(printf '%s:%s' "${GHCR_USER}" "${GHCR_TOKEN}" | base64 | tr -d '\n')"
    - savannah_auth="$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
    - printf '{"auths":{"ghcr.io":{"auth":"%s"},"%s":{"auth":"%s"}}}\n' "${ghcr_auth}" "${CI_REGISTRY}" "${savannah_auth}" > "${DOCKER_CONFIG}/config.json"
  script:
    - image_names="${SANDBOX_GEOSPATIAL_SAVANNAH_IMAGE}:${CI_COMMIT_SHA},${SANDBOX_GEOSPATIAL_GHCR_IMAGE}:${CI_COMMIT_SHA},${SANDBOX_GEOSPATIAL_SAVANNAH_IMAGE}:latest,${SANDBOX_GEOSPATIAL_GHCR_IMAGE}:latest"
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then version="${CI_COMMIT_TAG#v}"; image_names="${image_names},${SANDBOX_GEOSPATIAL_SAVANNAH_IMAGE}:${version},${SANDBOX_GEOSPATIAL_GHCR_IMAGE}:${version}"; fi
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=sandbox/runner/geospatial
      --local dockerfile=sandbox/runner/geospatial
      --opt filename=Containerfile
      --opt platform=linux/amd64
      --opt build-arg:SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}"
      --metadata-file geospatial-sandbox-metadata.json
      --output type=image,name="${image_names}",push=true,name-canonical=true,oci-mediatypes=true,rewrite-timestamp=true,compatibility-version=30
    - digest="$(awk -F '"' '$2 == "containerimage.digest" { print $4 }' geospatial-sandbox-metadata.json)"
    - test -n "${digest}"
    - printf 'XYLEM_SANDBOX_GEOSPATIAL_WORKLOAD=%s@%s\n' "${SANDBOX_GEOSPATIAL_SAVANNAH_IMAGE}" "${digest}" > geospatial-sandbox.env
    - printf 'XYLEM_SANDBOX_GEOSPATIAL_WORKLOAD_GHCR=%s@%s\n' "${SANDBOX_GEOSPATIAL_GHCR_IMAGE}" "${digest}" >> geospatial-sandbox.env
    - printf 'XYLEM_SANDBOX_GEOSPATIAL_WORKLOAD_SAVANNAH=%s@%s\n' "${SANDBOX_GEOSPATIAL_SAVANNAH_IMAGE}" "${digest}" >> geospatial-sandbox.env
  artifacts:
    reports:
      dotenv: geospatial-sandbox.env
    paths:
      - geospatial-sandbox-metadata.json

sandbox-docker-conformance:
  stage: sandbox
  allow_failure: true
  when: manual
  timeout: 20 minutes
  tags:
    - sandbox-docker-rootless-amd64
  variables:
    XYLEM_SANDBOX_EVIDENCE_DIR: $CI_PROJECT_DIR/sandbox-conformance-evidence/docker
    XYLEM_SANDBOX_RUNTIME: docker
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - sandbox/runner/**/*
        - scripts/check-rootless-sandbox.sh
        - crates/xylem-cli/**/*
        - crates/xylem-lib/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - test "$(uname -s)" = Linux
    - test "$(uname -m)" = x86_64
    - test -n "${XYLEM_SANDBOX_WORKLOAD:-}"
    - docker pull "${XYLEM_SANDBOX_WORKLOAD}"
    - sh scripts/check-rootless-sandbox.sh "${XYLEM_SANDBOX_RUNTIME}" "${XYLEM_SANDBOX_WORKLOAD}" 1073741824
    - cargo test -p xylem-cli test_native_rootless_sandbox_conformance -- --ignored --exact
    - cargo test -p xylem-cli test_native_sandbox_controller_death_and_retention_recovery -- --ignored --exact
  artifacts:
    when: always
    paths:
      - sandbox-conformance-evidence/docker/

sandbox-podman-conformance:
  stage: sandbox
  allow_failure: true
  when: manual
  timeout: 20 minutes
  tags:
    - sandbox-podman-rootless-amd64
  variables:
    XYLEM_SANDBOX_EVIDENCE_DIR: $CI_PROJECT_DIR/sandbox-conformance-evidence/podman
    XYLEM_SANDBOX_RUNTIME: podman
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - sandbox/runner/**/*
        - scripts/check-rootless-sandbox.sh
        - crates/xylem-cli/**/*
        - crates/xylem-lib/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - test "$(uname -s)" = Linux
    - test "$(uname -m)" = x86_64
    - test -n "${XYLEM_SANDBOX_WORKLOAD:-}"
    - podman pull "${XYLEM_SANDBOX_WORKLOAD}"
    - sh scripts/check-rootless-sandbox.sh "${XYLEM_SANDBOX_RUNTIME}" "${XYLEM_SANDBOX_WORKLOAD}" 1073741824
    - cargo test -p xylem-cli test_native_rootless_sandbox_conformance -- --ignored --exact
    - cargo test -p xylem-cli test_native_sandbox_controller_death_and_retention_recovery -- --ignored --exact
  artifacts:
    when: always
    paths:
      - sandbox-conformance-evidence/podman/

# ------------------------------------------------------------------ build ----

build-release:
  extends: .build-release
  stage: build
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - amd64
  needs:
    - job: prepare-environment
      artifacts: true
    - job: test
      optional: true
  before_script:
    - rustup target add "${DEFAULT_ARM64_TARGET}" "${DEFAULT_TARGET}" "${DEFAULT_WINDOWS_TARGET}"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Makefile
        - crates/xylem-cli/Cargo.toml
        - docs/src/_assets/xylem-app-icon.svg
        - packaging/linux/**/*
        - scripts/install-appimage-tools.sh
        - scripts/install-zigbuild.sh
        - scripts/package-linux.sh
  artifacts:
    paths:
      - bin/

validate-linux-amd64:
  extends: .validate-linux
  variables:
    DEB_ARCH: amd64
    APPIMAGE_ARCH: x86_64
    EXPECT_FILE_TYPE: x86-64
    EXPECT_EXEC: xylem tui
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Makefile
        - crates/xylem-cli/Cargo.toml
        - docs/src/_assets/xylem-app-icon.svg
        - packaging/linux/**/*
        - scripts/install-appimage-tools.sh
        - scripts/install-zigbuild.sh
        - scripts/package-linux.sh

validate-linux-arm64:
