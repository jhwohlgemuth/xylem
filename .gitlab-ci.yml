default:
  tags:
    - cpu
  image: rust
  before_script:
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - rustup component add rustfmt
    - rustup component add clippy
    - cargo binstall cargo-tarpaulin --no-discover-github-token --no-confirm

variables:
  USER: CI
  EMAIL: wohlgemuthjh@ornl.gov

stages:
  - test
  - publish

test:
  stage: test
  script: cargo test

publish:
  stage: publish
  inherit:
    default: true
    variables: true
  script:
    - cargo doc
    - git clone https://user:${ACCESS_TOKEN}@code-int.ornl.gov/sites/pipe.git site
    - ls
    - ls site
    - rm -rf ./site/html
    - mv target/doc/pipe/ ./site/
    - cd site
    - git add html
    - git commit -m "Publish changes"
    - git push
